# -------------------------------------------------------
# Asset Manager – application configuration
# -------------------------------------------------------

spring.application.name=asset-manager
server.port=8080

# --- H2 in-memory database (development / test) --------
spring.datasource.url=jdbc:h2:mem:assetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console – enabled for development convenience.
# CVE-2022-45868: H2 1.4.200 console allows unauthenticated remote access
# when webAllowOthers=true.  Set to false or remove the console entirely
# before deploying outside a developer workstation.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- JPA / Hibernate -----------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# --- Spring MVC ----------------------------------------
# Suffix-pattern matching retained for backward compatibility with legacy
# CMDB clients that append .json/.xml to request URIs.
#
# Security note: enabling suffix patterns on Spring Framework < 5.3.18
# (i.e. Spring Boot < 2.5.12 / < 2.6.6) combined with JDK 9+ and Tomcat
# is a prerequisite condition for CVE-2022-22965 (Spring4Shell).
# When upgrading Spring Boot to 2.6.x this property must be replaced with
# spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# and suffix matching must be disabled in WebMvcConfig.
spring.mvc.pathmatch.use-suffix-pattern=true
spring.mvc.pathmatch.use-registered-suffix-pattern=true

# --- Logging -------------------------------------------
# Overrides Spring Boot's default Logback configuration with log4j2.xml.
logging.config=classpath:log4j2.xml
